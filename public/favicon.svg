<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A192F" />
      <stop offset="100%" stop-color="#020C1B" />
    </linearGradient>

    <!-- Border Glow Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#00B8B2" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#EB5F46" stop-opacity="0.6" />
    </linearGradient>

    <!-- Bar 1 Gradient (Coral/Red) -->
    <linearGradient id="bar1" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#D94830" />
      <stop offset="100%" stop-color="#FF7A63" />
    </linearGradient>

    <!-- Bar 2 Gradient (Teal/Turquoise) -->
    <linearGradient id="bar2" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#008F8A" />
      <stop offset="100%" stop-color="#00E5DC" />
    </linearGradient>

    <!-- Bar 3 Gradient (Cyan/Blue) -->
    <linearGradient id="bar3" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#006699" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>

    <!-- Ambient glow filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Container Squircle -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#bgGrad)" />
  <rect x="2" y="2" width="60" height="60" rx="14" fill="none" stroke="url(#borderGrad)" stroke-width="1.75" />

  <!-- Subtle glow beneath bars -->
  <circle cx="44" cy="22" r="12" fill="#00B8B2" opacity="0.15" filter="url(#glow)" />

  <!-- Dynamic Demand Pipeline Bars -->
  <!-- Bar 1: Requerimientos / Entrada (Coral) -->
  <rect x="13" y="34" width="9" height="17" rx="4.5" fill="url(#bar1)" />

  <!-- Bar 2: Estimación y Proceso (Teal) -->
  <rect x="27.5" y="23" width="9" height="28" rx="4.5" fill="url(#bar2)" />

  <!-- Bar 3: Planificación y Entrega (Cyan/Blue) -->
  <rect x="42" y="14" width="9" height="37" rx="4.5" fill="url(#bar3)" />

  <!-- Dynamic Trend Curve Accent -->
  <path d="M 17.5 31 Q 32 19 46.5 11" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="0.1 0" opacity="0.85" />

  <!-- Target Sparkle / Spark at peak -->
  <path d="M 46.5 6.5 L 48 10 L 51.5 11.5 L 48 13 L 46.5 16.5 L 45 13 L 41.5 11.5 L 45 10 Z" fill="#FCD34D" filter="url(#glow)" />
</svg>
